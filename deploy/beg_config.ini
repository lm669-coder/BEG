[beg]
; Les variables Windows sont acceptees (%USERPROFILE%...). Le dossier "data" est
; dans le dossier SharePoint de l'application, synchronise par OneDrive.
;
; ATTENTION : une base SQLite sur un dossier synchronise supporte mal les
; enregistrements SIMULTANES de plusieurs postes (copies en conflit). L'application
; fait une sauvegarde quotidienne dans data\backups et signale les copies en conflit.
db_dir   = %USERPROFILE%\MIGNONE S.A\SP - Documents\03. Commun\38. Bilan d'expérience\data
data_dir = %USERPROFILE%\MIGNONE S.A\SP - Documents\03. Commun\38. Bilan d'expérience\data

; Copie de secours quotidienne de la base, sur le partage reseau (independante de OneDrive).
; Vide = desactivee. Un partage injoignable n'empeche jamais l'application de demarrer.
backup_dir_secours = \\192.168.1.220\datas\Technique\7 Modèles documents à utiliser\Bilan d'expérience\DB

; Dossiers des chantiers : le PDF du bilan et les photos y sont rangés, dans
; "<chantier>\Satisfaction & Expérience\{Photos, Bilan d'expérience}".
; Chantiers en cours = SharePoint synchronise ; chantiers clos = archives sur le partage
; reseau (chemin UNC : la lettre S: n'est pas forcement mappee sur chaque poste).
bat_en_cours  = %USERPROFILE%\MIGNONE S.A\SP - Documents\02. Batiment\21. Affaires en cours BAT
elec_en_cours = %USERPROFILE%\MIGNONE S.A\SP - Documents\01. Electricité\11. Affaires en cours
bat_archives  = \\192.168.1.220\datas\Technique\1 BATIMENT\Archives
elec_archives = \\192.168.1.220\datas\Technique\2 ELECTRICITE\Archives
